
name: Send calendar photo with button to MAX

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Download certificate
        run: |
          curl --fail --silent --show-error --location \
            https://gu-st.ru/content/Other/doc/russiantrustedca.pem \
            -o russiantrustedca.pem
          echo "6d1b66e7c1aa2512ad3abb50d6a6f144c9ee9d80fd7fbe1c9255a39f8e790944  russiantrustedca.pem" | sha256sum --check -

      - name: Upload photo and send message
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import ssl
          import time
          import uuid
          import urllib.request
          import urllib.error

          TOKEN = os.environ["MAX_BOT_TOKEN"]
          CHAT_ID = os.environ["MAX_CHAT_ID"]

          api_context = ssl.create_default_context(
              cafile="russiantrustedca.pem"
          )

          def api_request(url, data=None, headers=None, context=api_context):
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers or {},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(
                      req, context=context, timeout=60
                  ) as response:
                      body = response.read().decode("utf-8")
                      return response.status, body
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {e.code}: {error_body}"
                  )

          # 1. Скачиваем фотографию
          print("1. Скачиваем фотографию...")

          photo_url = (
              "https://i.ibb.co/S7PDHCz9/"
              "homeworkdirartifactspreview-1.jpg"
          )

          with urllib.request.urlopen(photo_url, timeout=60) as response:
              photo_data = response.read()

          if not photo_data:
              raise RuntimeError("Фотография скачалась пустой")

          print("Размер фото:", len(photo_data), "байт")

          # 2. Получаем адрес загрузки в MAX
          print("2. Запрашиваем адрес загрузки в MAX...")

          upload_api = (
              "https://platform-api2.max.ru/uploads?type=image"
          )

          status, body = api_request(
              upload_api,
              headers={
                  "Authorization": TOKEN,
                  "Accept": "application/json"
              }
          )

          upload_info = json.loads(body)
          upload_url = upload_info.get("url")

          if not upload_url:
              raise RuntimeError(
                  "MAX не вернул URL загрузки: " + body
              )

          print("Адрес загрузки получен!")

          # 3. Загружаем сам файл
          print("3. Загружаем фотографию на сервер MAX...")

          boundary = "----MAXUpload" + uuid.uuid4().hex

          multipart_body = (
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="data"; '
              'filename="conditions.jpg"\r\n'
              "Content-Type: image/jpeg\r\n\r\n"
          ).encode("utf-8") + photo_data + (
              f"\r\n--{boundary}--\r\n"
          ).encode("utf-8")

          status, upload_body = api_request(
              upload_url,
              data=multipart_body,
              headers={
                  "Authorization": TOKEN,
                  "Content-Type": f"multipart/form-data; boundary={boundary}"
              },
              context=ssl.create_default_context()
          )

          upload_result = json.loads(upload_body)

          image_token = (
              upload_result
              .get("photos", {})
              .get("photoIds", {})
              .get("token")
          )

          if not image_token:
              raise RuntimeError(
                  "MAX не вернул токен изображения. Ответ: "
                  + upload_body
              )

          print("Фотография успешно загружена!")

          # 4. Формируем одно сообщение: фото + текст + кнопка
          print("4. Отправляем сообщение в групповой чат...")

          message_payload = {
              "text": (
                  "📅 КАЛЕНДАРЬ КАНДИДАТОВ\n\n"
                  "Откройте календарь встреч и посмотрите "
                  "расписание кандидатов на объекте."
              ),
              "attachments": [
                  {
                      "type": "image",
                      "payload": {
                          "token": image_token
                      }
                  },
                  {
                      "type": "inline_keyboard",
                      "payload": {
                          "buttons": [
                              [
                                  {
                                      "type": "open_app",
                                      "text": "ОТКРЫТЬ",
                                      "web_app": "se15121687_bot"
                                  }
                              ]
                          ]
                      }
                  }
              ]
          }

          message_data = json.dumps(
              message_payload,
              ensure_ascii=False
          ).encode("utf-8")

          message_api = (
              "https://platform-api2.max.ru/messages?chat_id="
              + CHAT_ID
          )

          # MAX может обрабатывать фотографию несколько секунд.
          # При ошибке готовности повторяем отправку.
          for attempt in range(4):
              try:
                  status, result = api_request(
                      message_api,
                      data=message_data,
                      headers={
                          "Authorization": TOKEN,
                          "Content-Type": "application/json"
                      }
                  )

                  print("HTTP:", status)
                  print("Сообщение с фотографией и кнопкой отправлено!")
                  print("Ответ MAX:", result[:500])
                  break

              except RuntimeError as error:
                  if "attachment.not.ready" in str(error) and attempt < 3:
                      wait = 3 * (attempt + 1)
                      print(
                          f"Фотография ещё обрабатывается. "
                          f"Повтор через {wait} сек..."
                      )
                      time.sleep(wait)
                  else:
                      raise
          PY
