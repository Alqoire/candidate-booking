
name: MAX chat ID test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download and verify certificate
        run: |
          curl --fail --silent --show-error --location \
            https://gu-st.ru/content/Other/doc/russiantrustedca.pem \
            -o russiantrustedca.pem

          echo "6d1b66e7c1aa2512ad3abb50d6a6f144c9ee9d80fd7fbe1c9255a39f8e790944  russiantrustedca.pem" | sha256sum --check -

      - name: Check MAX subscriptions and updates
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import ssl
          import urllib.request
          import urllib.error

          token = os.environ["MAX_BOT_TOKEN"]
          context = ssl.create_default_context(cafile="russiantrustedca.pem")
          base = "https://platform-api2.max.ru"

          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Authorization": token}
              )
              try:
                  with urllib.request.urlopen(
                      request, context=context, timeout=30
                  ) as response:
                      return response.status, response.read().decode("utf-8")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8")

          print("=== WEBHOOK SUBSCRIPTIONS ===")
          status, response_body = get("/subscriptions")
          print("HTTP:", status)

          if status == 200:
              try:
                  data = json.loads(response_body)
                  print("Подписки получены.")
                  print("Количество подписок:",
                        len(data.get("subscriptions", [])))
              except Exception:
                  print("Ответ получен, но не удалось разобрать JSON.")
          else:
              print("Ответ MAX:", response_body[:1500])

          print("\n=== LONG POLLING ===")
          status, response_body = get("/updates?limit=100&timeout=0")
          print("HTTP:", status)

          try:
              data = json.loads(response_body)
              updates = data.get("updates", [])
              print("Количество событий:", len(updates))
              print("Marker:", data.get("marker"))

              for item in updates:
                  msg = item.get("message") or {}
                  recipient = msg.get("recipient") or {}
                  sender = msg.get("sender") or {}
                  body = msg.get("body") or {}

                  print("Событие:", item.get("update_type"))
                  print("Chat ID:", recipient.get("chat_id"))
                  print("Тип чата:", recipient.get("chat_type"))
                  print("Отправитель:", sender.get("first_name"))
                  print("Текст:", body.get("text"))
                  print("---")

          except Exception as error:
              print("Ошибка обработки ответа:", str(error))
              print("Ответ MAX:", response_body[:1500])

          PY
